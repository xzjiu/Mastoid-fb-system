[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mastoid-feedback-system"
version = "0.1.0"
description = "Evidence-grounded feedback from mastoidectomy simulator data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
pipeline = [
  "h5py>=3.10,<4",
  "numpy>=1.26,<3",
]
vision = [
  "opencv-python-headless>=4.8,<5",
  "scipy>=1.11,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
mastoid-feedback = "evidence_system.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_system = ["storage/*.sql"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
